name: Publish scenario preview

on:
  push:
    branches: [main]
    paths:
      - 'scenario-preview/**'
      - 'scripts/check_preview.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenario-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify preview and assemble artifact
        run: |
          node --check scenario-preview/data.js
          node --check scenario-preview/app.js
          python scripts/check_preview.py --output "$RUNNER_TEMP/haedong-pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/haedong-pages
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: publish
        uses: actions/deploy-pages@v5
