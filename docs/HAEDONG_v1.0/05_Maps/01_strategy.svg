<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800"><rect width="1100" height="800" fill="#f4eee0"/><style>text{font-family:Noto Sans CJK KR,sans-serif;fill:#242c34}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#315c85"/></marker></defs><text x="50" y="60" font-size="32">요동 전략 개념도</text><text x="50" y="100" font-size="21">요동의 여러 성과 평양·오골성의 관계;위치·거리 미확정</text><path d="M800 540 L360 320" stroke="#315c85" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M360 320 L190 240" stroke="#ab4c42" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M360 320 L680 340" stroke="#587a42" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M360 320 L120 480" stroke="#315c85" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M360 320 L620 170" stroke="#ab4c42" stroke-width="7" fill="none" marker-end="url(#arrow)"/><circle cx="800" cy="540" r="18" fill="#eee4ce" stroke="#252c35" stroke-width="3"/><text x="824" y="548" font-size="23">평양</text><circle cx="360" cy="320" r="18" fill="#eee4ce" stroke="#252c35" stroke-width="3"/><text x="384" y="328" font-size="23">안시성</text><circle cx="190" cy="240" r="18" fill="#eee4ce" stroke="#252c35" stroke-width="3"/><text x="214" y="248" font-size="23">요동성</text><circle cx="680" cy="340" r="18" fill="#eee4ce" stroke="#252c35" stroke-width="3"/><text x="704" y="348" font-size="23">오골성</text><circle cx="120" cy="480" r="18" fill="#eee4ce" stroke="#252c35" stroke-width="3"/><text x="144" y="488" font-size="23">요수 방면</text><circle cx="620" cy="170" r="18" fill="#eee4ce" stroke="#252c35" stroke-width="3"/><text x="644" y="178" font-size="23">북동 산성(가상)</text><text x="50" y="710" font-size="19">게임概念도 · 비축척 · 방위는 플레이용 배치이며 실측 지형이 아님</text><text x="50" y="738" font-size="19">청색=고구려 이동/연결 · 적색=두번째 작전선 · 녹색=보급/협력선</text><text x="50" y="766" font-size="19">거리·시간·진형의 세부 배치는 신규 설계 N; 사건 제목만 G 기록에 대응</text></svg>